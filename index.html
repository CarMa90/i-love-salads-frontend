    <title>I Love Salads</title>
    <script type="text/javascript">
      // Este script toma el parámetro de consulta generado por el 404.html y lo reinyecta limpiamente en React Router
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>
